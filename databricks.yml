bundle:
  name: diabetic-outcomes

include:
  - resources/*.yml

variables:
  catalog:
    default: main
  schema:
    default: hls_demo_omop_analytics

# Use an accessible workspace catalog for bundle-managed resources in this run.
# Source OMOP tables remain referenced explicitly in transformation code.
targets:
  dev:
    default: true
    mode: development
    variables:
      catalog: cme_outcomes_uswest
      schema: lakefoundry

