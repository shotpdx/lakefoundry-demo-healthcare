bundle:
  name: diabetic-outcomes

include:
  - resources/*.yml

variables:
  catalog:
    default: cme_outcomes_uswest
  schema:
    default: lakefoundry
  source_catalog:
    default: databricks_observational_medical_outcomes_partnership_omop_common_data_model_cdm
  source_schema:
    default: patient_risk_altered_omop

# Use an accessible workspace catalog/schema for bundle-managed resources.
# The pipeline reads source OMOP tables from the transformation code constants.
targets:
  dev:
    default: true
    mode: development
    variables:
      catalog: cme_outcomes_uswest
      schema: lakefoundry
      source_catalog: databricks_observational_medical_outcomes_partnership_omop_common_data_model_cdm
      source_schema: patient_risk_altered_omop

