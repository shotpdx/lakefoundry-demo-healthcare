  contract_version: '1.0'
  title: Diabetic Patient Treatment Outcome Comparison Pipeline
  requester:
    name: User
    role: Requester
    org: Unknown
  stakeholders: []
  source_context:
    conversation_id: healthcare_rwe_demo_conversation
    links: []
